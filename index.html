<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="무지개 챔피언스 리그 종목별 랭킹" />
    <title>Rainbow Champions League — RCL</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <div class="watermark" aria-hidden="true">
        <div id="watermark-track" class="watermark-track"></div>
      </div>

      <button id="sound-toggle" class="sound-toggle" type="button" aria-label="배경 음악 재생" aria-pressed="false">
        <svg class="sound-icon sound-icon-off" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M11 5 6.5 9H3v6h3.5L11 19V5Zm4.5 5.5 4 4m0-4-4 4" />
        </svg>
        <svg class="sound-icon sound-icon-on" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M11 5 6.5 9H3v6h3.5L11 19V5Zm4 3.5a5 5 0 0 1 0 7m2.5-9.5a8 8 0 0 1 0 12" />
        </svg>
      </button>

      <header class="site-header">
        <div class="title-board">
          <span class="title-star title-star-left" aria-hidden="true">★</span>
          <span class="title-star title-star-right" aria-hidden="true">★</span>
          <p class="eyebrow">Rainbow Champions League — RCL</p>
          <h1>무지개 챔피언스 리그</h1>
          <div class="rainbow-pixels" aria-hidden="true">
            <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
          </div>
          <p class="subtitle">"무지개의 끝에는 우승자가 있다."</p>
        </div>
        <p id="updated-at" class="updated-at"></p>
      </header>

      <nav class="sport-tabs" aria-label="종목 선택">
        <div id="tabs" class="tabs" role="tablist"></div>
      </nav>

      <section class="ranking-section" aria-labelledby="ranking-title">
        <div class="section-heading">
          <div>
            <h2 id="ranking-title">종목 랭킹</h2>
            <p id="ranking-title-en" class="ranking-title-en"></p>
          </div>
          <span id="player-count" class="player-count"></span>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col">순위</th>
                <th scope="col">선수</th>
              </tr>
            </thead>
            <tbody id="ranking-body"></tbody>
          </table>
          <p id="empty-state" class="empty-state" hidden>등록된 순위가 없습니다.</p>
        </div>
      </section>

      <audio id="bgm" src="echoes_of_lumen-sport-workout-gym-fitness-586974.mp3" preload="metadata" loop></audio>
    </main>

    <script src="rankings-data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
